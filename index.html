<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NetVault Pro Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #0284c7; --text: #f8fafc; --success: #10b981; --error: #ef4444; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding-bottom: 50px; }
        .wrapper { max-width: 450px; margin: 0 auto; padding: 20px; }
        .section { background: var(--card); border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid #334155; }
        .btn { width: 100%; padding: 15px; border-radius: 12px; border: none; background: var(--accent); color: white; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        .btn-sec { background: #475569; }
        .hidden { display: none !important; }
        .price-tag { color: var(--success); font-weight: bold; }
        input { width: 100%; padding: 12px; box-sizing: border-box; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; margin-top: 5px; }
    </style>
</head>
<body>

<div class="wrapper">
    <div id="view-catalog" class="section">
        <h1 style="text-align:center">NetVault Store</h1>
        <div id="catalog-content"></div>
        <button class="btn btn-sec" onclick="App.toggleCart()">Корзина (<span id="cart-count">0</span>)</button>
        <button class="btn" style="background:transparent; border:1px solid #475569" onclick="App.showView('view-admin')">Админка</button>
    </div>

    <div id="view-cart" class="section hidden">
        <h1>Ваш заказ</h1>
        <div id="cart-list"></div>
        <input type="text" id="delivery-address" placeholder="Адрес / Телеграм">
        <button class="btn" onclick="App.checkout()">Оформить (Оплата 2200-7020-5664-8004)</button>
        <button class="btn btn-sec" onclick="App.showView('view-catalog')">Назад</button>
    </div>

    <div id="view-payment" class="section hidden">
        <h1>Оплата</h1>
        <p>Переведите сумму на карту:</p>
        <div style="background:white; color:black; padding:15px; border-radius:8px; font-weight:bold; text-align:center; font-size:1.2rem;">2200-7020-5664-8004</div>
        <p>Номер заказа: <b id="order-id-display">...</b></p>
        <button class="btn" onclick="App.showView('view-catalog')">В меню</button>
    </div>

    <div id="view-admin" class="section hidden">
        <h1>Админка</h1>
        <input type="password" id="admin-key" placeholder="Пароль">
        <button class="btn" onclick="App.loginAdmin()">Войти</button>
        <div id="admin-orders" class="hidden"></div>
        <button class="btn btn-sec" onclick="App.showView('view-catalog')">Назад</button>
    </div>
</div>

<script>
const App = {
    db: null,
    cart: [],
    botToken: "8681452451:AAG5u9rdggoEChM10yoahJMjmND5N5ajMgg",
    adminId: "5737961034",
    
    products: [
        { name: 'WireGuard VPN', price: 450, type: 'VPN' },
        { name: 'Amnezia VPN', price: 450, type: 'VPN' },
        { name: 'Vless VPN', price: 400, type: 'VPN' },
        { name: 'Netcraze NC-1121', price: 9800, type: 'Router' },
        { name: 'Netcraze NC-1812', price: 36000, type: 'Router' },
        { name: 'Netcraze NC-3811', price: 19800, type: 'Router' },
        { name: 'Netcraze NC-3013', price: 14800, type: 'Router' },
        { name: 'Netcraze 4G NC-2212 (SIM)', price: 12800, type: 'Router' }
    ],

    init: function() {
        this.db = supabase.createClient(
            "https://ufpfkvuujlrcgpiquaep.supabase.co", 
            "sb_publishable_uTITwoPrMgGoZReqJ35x1g_ejOU4eXF"
        );
        Telegram.WebApp.ready();
        this.renderCatalog();
    },

    showView: function(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    },

    renderCatalog: function() {
        const c = document.getElementById('catalog-content');
        c.innerHTML = this.products.map(p => `
            <button class="btn" onclick="App.addToCart('${p.name}', ${p.price})">
                ${p.name} - <span class="price-tag">${p.price}₽</span>
            </button>
        `).join('');
    },

    addToCart: function(name, price) {
        this.cart.push({name, price});
        document.getElementById('cart-count').innerText = this.cart.length;
        alert("Добавлено: " + name);
    },

    toggleCart: function() {
        const list = document.getElementById('cart-list');
        list.innerHTML = this.cart.map(i => `<p>${i.name} - ${i.price}₽</p>`).join('');
        this.showView('view-cart');
    },

    notifyBot: async function(msg) {
        const url = `https://api.telegram.org/bot${this.botToken}/sendMessage`;
        await fetch(url, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ chat_id: this.adminId, text: msg, parse_mode: 'HTML' })
        });
    },

    checkout: async function() {
        const addr = document.getElementById('delivery-address').value;
        if(!addr) return alert("Введите адрес/контакт!");
        
        const total = this.cart.reduce((a, b) => a + b.price, 0);
        const { data, error } = await this.db.from('orders').insert([{
            items: JSON.stringify(this.cart),
            total_price: total,
            address: addr,
            payment_status: 'pending'
        }]).select();

        if(data) {
            document.getElementById('order-id-display').innerText = data[0].id;
            await this.notifyBot(`<b>🔥 Новый заказ #${data[0].id}</b>\nСумма: ${total}₽\nКлиент: ${addr}`);
            this.cart = [];
            document.getElementById('cart-count').innerText = "0";
            this.showView('view-payment');
        }
    },

    loginAdmin: async function() {
        const p = document.getElementById('admin-key').value;
        if(p !== "admin123") return alert("Неверный пароль");
        
        document.getElementById('admin-orders').classList.remove('hidden');
        const { data } = await this.db.from('orders').select('*').order('created_at', { ascending: false });
        
        document.getElementById('admin-orders').innerHTML = data.map(o => `
            <div style="border:1px solid #475569; padding:10px; margin-top:10px;">
                Заказ #${o.id} | ${o.total_price}₽ <br>
                Статус: <b>${o.payment_status}</b> <br>
                <button onclick="App.confirm(${o.id})">Подтвердить оплату</button>
            </div>
        `).join('');
    },

    confirm: async function(id) {
        await this.db.from('orders').update({ payment_status: 'paid' }).eq('id', id);
        this.loginAdmin();
    }
};
window.addEventListener('DOMContentLoaded', () => App.init());
</script>
</body>
</html>
