<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>NetVault Pro Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #0284c7; --text: #f8fafc; --success: #10b981; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 20px; }
        .section { background: var(--card); padding: 20px; border-radius: 16px; margin-bottom: 20px; }
        .btn { width: 100%; padding: 12px; border-radius: 8px; border: none; background: var(--accent); color: white; margin-top: 5px; cursor: pointer; }
        .receipt { background: #fff; color: #000; padding: 15px; border-radius: 8px; margin: 10px 0; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="app" style="max-width:400px; margin:0 auto;">
    <div id="view-user" class="section">
        <h1>Привет, <span id="user-name"></span></h1>
        <button class="btn" onclick="App.showView('view-profile')">Мой профиль и ключи</button>
        <button class="btn" onclick="App.showView('view-shop')">Магазин</button>
        <div id="admin-link" class="hidden">
            <button class="btn" style="background:#ef4444" onclick="App.showAdmin()">Админ-панель</button>
        </div>
    </div>

    <div id="view-profile" class="section hidden">
        <h1>Подписки</h1>
        <div id="my-keys">Загрузка...</div>
        <button class="btn" onclick="App.showView('view-user')">Назад</button>
    </div>

    <div id="view-admin" class="section hidden">
        <h1>Панель управления</h1>
        <h3>Управление странами</h3>
        <input id="new-country" placeholder="Название страны">
        <button class="btn" onclick="App.addCountry()">Добавить страну</button>
        <div id="admin-locations"></div>
        <hr>
        <h3>Заказы и подписки</h3>
        <div id="admin-orders"></div>
        <button class="btn" onclick="App.showView('view-user')">Выход</button>
    </div>

    <div id="view-receipt" class="section hidden">
        <h1>Оформлено!</h1>
        <div class="receipt">
            <p>Заказ: <b id="rec-id"></b></p>
            <p>Перевести на: <b>2200-7020-5664-8004</b></p>
            <p>Кому: <b>Игорь Дурасов</b></p>
            <p>Сумма: <b id="rec-sum"></b></p>
            <p style="color:red">!УКАЖИТЕ НОМЕР ЗАКАЗА В ПЕРЕВОДЕ!</p>
        </div>
        <button class="btn" onclick="App.showView('view-user')">Понятно</button>
    </div>
</div>

<script>
const App = {
    db: null,
    user: null,
    adminId: 5737961034,

    init: async function() {
        this.db = supabase.createClient("URL_SUPABASE", "KEY_SUPABASE");
        Telegram.WebApp.ready();
        this.user = Telegram.WebApp.initDataUnsafe.user;
        
        if(!this.user) return alert("Ошибка авторизации");
        document.getElementById('user-name').innerText = this.user.first_name;
        
        if(this.user.id === this.adminId) document.getElementById('admin-link').classList.remove('hidden');
        this.loadProfile();
    },

    showView: (id) => {
        document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    },

    loadProfile: async function() {
        const { data } = await this.db.from('user_keys').select('*').eq('user_id', this.user.id);
        document.getElementById('my-keys').innerHTML = data.map(k => `
            <div style="border-bottom:1px solid #475569; margin:10px 0;">
                <p><b>${k.country}</b> - ${k.protocol}</p>
                <p>Истекает: ${k.exp_date}</p>
            </div>
        `).join('');
    },

    showAdmin: async function() {
        this.showView('view-admin');
        // Загрузка заказов для управления подписками
        const { data } = await this.db.from('orders').select('*');
        document.getElementById('admin-orders').innerHTML = data.map(o => `
            <div class="section" style="background:#0f172a">
                Заказ #${o.id} | ${o.total_price}₽ <br>
                <input type="date" id="date-${o.id}">
                <button onclick="App.setExpDate(${o.id})">Установить дату</button>
                <button onclick="App.deleteSub(${o.id})" style="background:red">Удалить подписку</button>
            </div>
        `).join('');
    },

    setExpDate: async function(id) {
        const date = document.getElementById(`date-${id}`).value;
        await this.db.from('user_keys').update({ exp_date: date }).eq('order_id', id);
        alert("Дата обновлена");
    },

    deleteSub: async function(id) {
        await this.db.from('user_keys').delete().eq('order_id', id);
        alert("Подписка удалена");
    },

    addCountry: async function() {
        const name = document.getElementById('new-country').value;
        await this.db.from('locations').insert({ name });
        alert("Страна добавлена");
    }
};
App.init();
</script>
</body>
</html>
