<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetVault | Универсальная версия</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }
        .profile-container { position: absolute; top: 20px; left: 20px; z-index: 100; }
        .avatar {
            width: 45px; height: 45px; border-radius: 50%; background-color: #334155;
            border: 2px solid #38bdf8; cursor: pointer; display: flex;
            justify-content: center; align-items: center; font-size: 20px; position: relative;
        }
        .admin-badge {
            position: absolute; top: -8px; right: -8px; font-size: 16px;
            background: #eab308; border-radius: 50%; padding: 2px; display: none;
        }
        .profile-dropdown {
            position: absolute; top: 55px; left: 0; background: #1e293b;
            border: 1px solid #334155; border-radius: 8px; width: 160px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); display: none;
            flex-direction: column; overflow: hidden;
        }
        .dropdown-item {
            padding: 10px 15px; font-size: 0.9rem; color: #f8fafc;
            background: none; border: none; width: 100%; text-align: left; cursor: pointer;
        }
        .dropdown-item:hover { background: #334155; color: #38bdf8; }
        .dropdown-item.admin-btn { color: #eab308; font-weight: bold; display: none; border-bottom: 1px solid #334155; }
        .dropdown-item.logout { color: #ef4444; border-top: 1px solid #334155; }
        .card {
            background: #1e293b; padding: 40px; border-radius: 16px;
            text-align: center; max-width: 460px; width: 100%; border: 1px solid #334155;
        }
        .logo-icon { font-size: 50px; margin-bottom: 15px; }
        h1 { font-size: 1.8rem; color: #38bdf8; margin-bottom: 10px; }
        .subtitle { color: #94a3b8; font-size: 0.95rem; margin-bottom: 25px; }
        .btn {
            display: block; width: 100%; padding: 12px; margin-bottom: 15px;
            background-color: #0284c7; color: white; border: none; border-radius: 8px;
            font-size: 1rem; font-weight: 600; cursor: pointer;
        }
        .btn:hover { background-color: #0369a1; }
        .btn-secondary { background-color: #475569; }
        .btn-secondary:hover { background-color: #334155; }
        .btn-danger { background-color: #ef4444; padding: 4px 8px; font-size: 0.8rem; width: auto; border-radius: 4px; margin: 0; }
        .btn-flag { display: flex; align-items: center; justify-content: center; gap: 12px; }
        .tg-widget-container { display: flex; justify-content: center; margin-top: 20px; }
        .order-box { background: #0f172a; border: 1px dashed #10b981; padding: 15px; border-radius: 8px; margin-top: 15px; text-align: left; }
        .key-display { background: #1e293b; padding: 10px; border-radius: 6px; word-break: break-all; font-family: monospace; color: #10b981; margin-top: 10px; }
        .admin-section { background: #0f172a; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: left; }
        .admin-section h3 { font-size: 1rem; color: #38bdf8; margin-bottom: 10px; display: flex; justify-content: space-between; }
        .admin-input-group { display: flex; gap: 10px; margin-bottom: 10px; }
        .admin-input { flex: 1; padding: 8px; background: #1e293b; border: 1px solid #334155; border-radius: 6px; color: white; }
        .admin-list { list-style: none; max-height: 180px; overflow-y: auto; }
        .admin-list li { display: flex; justify-content: space-between; align-items: center; padding: 8px; background: #1e293b; margin-bottom: 4px; border-radius: 6px; font-size: 0.9rem; }
        .clickable-li { cursor: pointer; }
        .clickable-li:hover { background: #334155; }
        .show { display: flex !important; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="profile-container">
        <div class="avatar" id="avatar-btn" onclick="handleAvatarClick()">
            <span id="avatar-placeholder">👤</span>
            <div class="admin-badge" id="admin-crown">👑</div>
        </div>
        <div class="profile-dropdown" id="profile-menu">
            <button class="dropdown-item admin-btn" id="admin-dropdown-link" onclick="openAdminProtocolSelect()">👑 Админка</button>
            <button class="dropdown-item" onclick="alert('В разработке')">Настройки</button>
            <button class="dropdown-item logout" onclick="logout()">Выйти</button>
        </div>
    </div>

    <div id="home-view" class="card">
        <div class="logo-icon">⚡</div>
        <h1>NetVault</h1>
        <p class="subtitle">Приватные VPN-серверы и оборудование</p>
        <div id="user-status" style="margin-bottom: 20px; color: #10b981; font-weight: bold;" class="hidden"></div>
        <button class="btn" onclick="handleAction('router')">Покупка роутера</button>
        <button class="btn btn-secondary" onclick="handleAction('vpn')">Покупка VPN</button>
    </div>

    <div id="auth-view" class="card hidden">
        <div class="logo-icon">🔐</div>
        <h1>Вход в систему</h1>
        <p class="subtitle">Авторизуйтесь через Telegram для покупки конфигураций.</p>
        <div class="tg-widget-container" id="tg-widget-box">
            </div>
        <button class="btn btn-secondary" style="margin-top: 20px;" onclick="goBackToHome()">Назад</button>
    </div>

    <div id="vpn-protocol-view" class="card hidden">
        <div class="logo-icon">🛠️</div>
        <h1>Выбор протокола</h1>
        <button class="btn" onclick="selectProtocol('Vless')">Vless</button>
        <button class="btn" onclick="selectProtocol('AmneziaWG')">AmneziaWG</button>
        <button class="btn" onclick="selectProtocol('WireGuard')">WireGuard</button>
        <button class="btn btn-secondary" onclick="goBackToHome()">Назад</button>
    </div>

    <div id="vpn-country-view" class="card hidden">
        <div class="logo-icon">🌍</div>
        <h1>Выбор локации</h1>
        <div id="countries-list-user"></div>
        <button class="btn btn-secondary" style="margin-top: 10px;" onclick="goBackToProtocol()">Назад</button>
    </div>

    <div id="order-success-view" class="card hidden">
        <div class="logo-icon">🎉</div>
        <h1 style="color: #10b981;">Успешно!</h1>
        <div class="order-box">
            <p>• Протокол: <strong id="summary-protocol">-</strong></p>
            <p>• Страна: <strong id="summary-country">-</strong></p>
            <p style="color: #eab308; margin-top: 15px; font-weight: bold;">Твой ключ доступа:</p>
            <div class="key-display" id="user-vpn-key">-</div>
        </div>
        <button class="btn" style="margin-top: 25px;" onclick="goBackToHome()">В меню</button>
    </div>

    <div id="admin-proto-view" class="card hidden">
        <h1 style="color: #eab308;">Админка</h1>
        <button class="btn" onclick="openAdminCountries('Vless')">Vless</button>
        <button class="btn" onclick="openAdminCountries('AmneziaWG')">AmneziaWG</button>
        <button class="btn" onclick="openAdminCountries('WireGuard')">WireGuard</button>
        <button class="btn btn-secondary" onclick="goBackToHome()">Выйти</button>
    </div>

    <div id="admin-countries-view" class="card hidden">
        <h1 id="admin-countries-title" style="color: #eab308;">Страны</h1>
        <div class="admin-section">
            <h3>Добавить страну</h3>
            <div class="admin-input-group">
                <input type="text" id="new-country-name" class="admin-input" placeholder="Страна">
                <input type="text" id="new-country-flag" class="admin-input" placeholder="🇩🇪" style="max-width: 60px;">
                <button class="btn" style="margin:0; width:auto; padding:8px;" onclick="addCountry()">+</button>
            </div>
            <ul class="admin-list" id="admin-countries-list"></ul>
        </div>
        <button class="btn btn-secondary" onclick="openAdminProtocolSelect()">Назад</button>
    </div>

    <div id="admin-keys-view" class="card hidden">
        <h1 id="admin-keys-title" style="color: #eab308;">Ключи</h1>
        <div class="admin-section">
            <h3>Добавить ключ</h3>
            <div class="admin-input-group">
                <input type="text" id="new-vpn-key" class="admin-input" placeholder="Конфиг">
                <button class="btn" style="margin:0; width:auto; padding:8px;" onclick="addVpnKey()">+</button>
            </div>
            <ul class="admin-list" id="admin-keys-list"></ul>
        </div>
        <button class="btn btn-secondary" onclick="goBackToAdminCountries()">Назад</button>
    </div>

    <script>
        // ИНИЦИАЛИЗАЦИЯ SUPABASE (СТРОГО ОДИН РАЗ)
        const SUPABASE_URL = "https://ufpfkvuujlrcgpiquaep.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_uTITwoPrMgGoZReqJ35x1g_ejOU4eXF"; 
        const supabase = window['@supabase/supabase-js'].createClient(SUPABASE_URL, SUPABASE_KEY);

        const ADMIN_IDS = [5737961034]; 

        let isLoggedIn = false;
        let isAdmin = false;
        let pendingAction = "";
        let selectedProtocolName = "";
        let selectedCountryName = "";
        let adminSelectedProtocol = "";
        let adminSelectedCountryId = null;
        let rawCloudData = [];

        // Элементы
        const homeView = document.getElementById('home-view');
        const authView = document.getElementById('auth-view');
        const vpnProtocolView = document.getElementById('vpn-protocol-view');
        const vpnCountryView = document.getElementById('vpn-country-view');
        const orderSuccessView = document.getElementById('order-success-view');
        const adminProtoView = document.getElementById('admin-proto-view');
        const adminCountriesView = document.getElementById('admin-countries-view');
        const adminKeysView = document.getElementById('admin-keys-view');
        const userStatus = document.getElementById('user-status');
        const avatarBtn = document.getElementById('avatar-btn');
        const profileMenu = document.getElementById('profile-menu');
        const adminDropdownLink = document.getElementById('admin-dropdown-link');

        async function fetchDatabase() {
            const { data } = await supabase.from('vpn_data').select('*');
            rawCloudData = data || [];
        }

        // Автоматическая проверка: открыто ли как Mini App
        window.addEventListener('DOMContentLoaded', async () => {
            await fetchDatabase();
            
            // Если Telegram WebApp SDK инициализировал данные пользователя
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
                const tgUser = window.Telegram.WebApp.initDataUnsafe.user;
                console.log("Запущено как Telegram Mini App для пользователя:", tgUser.username);
                authorizeUser({
                    id: tgUser.id,
                    first_name: tgUser.first_name,
                    photo_url: tgUser.photo_url
                });
            } else {
                // Если открыто в обычном браузере — динамически создаем виджет авторизации
                console.log("Запущено в обычном браузере. Подключаем виджет.");
                const script = document.createElement('script');
                script.async = true;
                script.src = "https://telegram.org/js/telegram-widget.js?22";
                script.setAttribute('data-telegram-login', "NettVault_bot");
                script.setAttribute('data-size', "large");
                script.setAttribute('data-radius', "8");
                script.setAttribute('data-request-access', "write");
                
                // Функция-мост для виджета браузера
                window.onTelegramAuth = function(user) {
                    authorizeUser(user);
                };
                script.setAttribute('data-onauth', "onTelegramAuth(user)");
                document.getElementById('tg-widget-box').appendChild(script);
            }
        });

        function authorizeUser(user) {
            isLoggedIn = true;
            userStatus.classList.remove('hidden');
            userStatus.innerText = `👋 Привет, ${user.first_name}!`;

            if (user.photo_url) {
                avatarBtn.innerHTML = `<img src="${user.photo_url}" alt="Ava"><div class="admin-badge" id="admin-crown">👑</div>`;
            } else {
                avatarBtn.innerHTML = `<span>😎</span><div class="admin-badge" id="admin-crown">👑</div>`;
            }

            const currentCrown = document.getElementById('admin-crown');
            if (ADMIN_IDS.includes(user.id)) {
                isAdmin = true;
                currentCrown.style.display = 'block';
                adminDropdownLink.style.display = 'block';
            } else {
                isAdmin = false;
                currentCrown.style.display = 'none';
                adminDropdownLink.style.display = 'none';
            }

            if (pendingAction === 'vpn') {
                handleAction('vpn');
            } else {
                goBackToHome();
            }
            pendingAction = "";
        }

        async function handleAction(itemType) {
            if (isLoggedIn) {
                if (itemType === 'vpn') {
                    hideAllViews();
                    await fetchDatabase();
                    vpnProtocolView.classList.remove('hidden');
                } else {
                    alert('Раздел роутеров в разработке.');
                }
            } else {
                pendingAction = itemType;
                hideAllViews();
                authView.classList.remove('hidden');
            }
        }

        async function selectProtocol(protocol) {
            selectedProtocolName = protocol;
            hideAllViews();
            await fetchDatabase();
            renderUserCountries();
            vpnCountryView.classList.remove('hidden');
        }

        function renderUserCountries() {
            const container = document.getElementById('countries-list-user');
            container.innerHTML = "";
            const availableCountries = rawCloudData.filter(row => row.protocol === selectedProtocolName);
            if (availableCountries.length === 0) {
                container.innerHTML = "<p class='subtitle'>Нет доступных локаций.</p>";
                return;
            }
            availableCountries.forEach(country => {
                const btn = document.createElement('button');
                btn.className = "btn btn-flag";
                const keysCount = country.keys ? country.keys.length : 0;
                btn.innerHTML = `<span>${country.flag || '🌐'}</span> ${country.country_name} (${keysCount} шт.)`;
                btn.onclick = () => selectCountry(country);
                container.appendChild(btn);
            });
        }

        async function selectCountry(countryRow) {
            selectedCountryName = countryRow.country_name;
            hideAllViews();
            document.getElementById('summary-protocol').innerText = selectedProtocolName;
            document.getElementById('summary-country').innerText = (countryRow.flag || '🌐') + " " + selectedCountryName;
            const keyDisplay = document.getElementById('user-vpn-key');
            keyDisplay.innerText = "Получение ключа...";
            orderSuccessView.classList.remove('hidden');

            const { data: freshRows } = await supabase.from('vpn_data').select('*').eq('id', countryRow.id);
            const liveRow = freshRows ? freshRows[0] : null;

            if (liveRow && liveRow.keys && liveRow.keys.length > 0) {
                let currentKeys = [...liveRow.keys];
                const issuedKey = currentKeys.shift();
                const { error } = await supabase.from('vpn_data').update({ keys: currentKeys }).eq('id', countryRow.id);
                if (!error) keyDisplay.innerText = issuedKey;
                else keyDisplay.innerText = "Ошибка базы.";
            } else {
                keyDisplay.innerText = "Ключи закончились.";
            }
        }

        /* АДМИНКА ФУНКЦИИ */
        async function openAdminProtocolSelect() { hideAllViews(); await fetchDatabase(); adminProtoView.classList.remove('hidden'); profileMenu.classList.remove('show'); }
        function openAdminCountries(protocol) { adminSelectedProtocol = protocol; hideAllViews(); document.getElementById('admin-countries-title').innerText = `🌍 ${protocol}: Страны`; renderAdminCountriesList(); adminCountriesView.classList.remove('hidden'); }
        function renderAdminCountriesList() {
            const listContainer = document.getElementById('admin-countries-list'); listContainer.innerHTML = "";
            const list = rawCloudData.filter(row => row.protocol === adminSelectedProtocol);
            list.forEach(country => {
                const li = document.createElement('li'); li.className = "clickable-li";
                const keysLen = country.keys ? country.keys.length : 0;
                li.innerHTML = `<span onclick="openAdminKeys(${country.id}, '${country.country_name}', '${country.flag}')" style="flex:1; padding:5px 0;">${country.flag || '🌐'} ${country.country_name} (${keysLen} шт.)</span><button class="btn btn-danger" onclick="deleteCountry(${country.id})">X</button>`;
                listContainer.appendChild(li);
            });
        }
        async function addCountry() {
            const name = document.getElementById('new-country-name').value.trim();
            const flag = document.getElementById('new-country-flag').value.trim() || "🌐";
            if (!name) return;
            await supabase.from('vpn_data').insert([{ protocol: adminSelectedProtocol, country_name: name, flag: flag, keys: [] }]);
            document.getElementById('new-country-name').value = "";
            await fetchDatabase(); renderAdminCountriesList();
        }
        async function deleteCountry(id) { await supabase.from('vpn_data').delete().eq('id', id); await fetchDatabase(); renderAdminCountriesList(); }
        function openAdminKeys(countryId, countryName, countryFlag) { adminSelectedCountryId = countryId; hideAllViews(); document.getElementById('admin-keys-title').innerText = `${countryFlag} Ключи: ${countryName}`; renderAdminKeysList(); adminKeysView.classList.remove('hidden'); }
        function renderAdminKeysList() {
            const listContainer = document.getElementById('admin-keys-list'); listContainer.innerHTML = "";
            const country = rawCloudData.find(row => row.id === adminSelectedCountryId);
            if (!country || !country.keys) return;
            country.keys.forEach((key, index) => {
                const li = document.createElement('li');
                li.innerHTML = `<span>${key.substring(0,30)}...</span><button class="btn btn-danger" onclick="deleteKey(${index})">X</button>`;
                listContainer.appendChild(li);
            });
        }
        async function addVpnKey() {
            const newKey = document.getElementById('new-vpn-key').value.trim(); if (!newKey) return;
            const country = rawCloudData.find(row => row.id === adminSelectedCountryId);
            let updatedKeys = country.keys ? [...country.keys] : []; updatedKeys.push(newKey);
            await supabase.from('vpn_data').update({ keys: updatedKeys }).eq('id', adminSelectedCountryId);
            document.getElementById('new-vpn-key').value = "";
            await fetchDatabase(); renderAdminKeysList();
        }
        async function deleteKey(index) {
            const country = rawCloudData.find(row => row.id === adminSelectedCountryId);
            let updatedKeys = [...country.keys]; updatedKeys.splice(index, 1);
            await supabase.from('vpn_data').update({ keys: updatedKeys }).eq('id', adminSelectedCountryId);
            await fetchDatabase(); renderAdminKeysList();
        }
        async function goBackToAdminCountries() { hideAllViews(); await fetchDatabase(); adminCountriesView.classList.remove('hidden'); renderAdminCountriesList(); }

        /* НАВИГАЦИЯ */
        function goBackToHome() { hideAllViews(); homeView.classList.remove('hidden'); }
        function goBackToProtocol() { hideAllViews(); vpnProtocolView.classList.remove('hidden'); }
        function hideAllViews() {
            homeView.classList.add('hidden'); authView.classList.add('hidden'); vpnProtocolView.classList.add('hidden');
            vpnCountryView.classList.add('hidden'); orderSuccessView.classList.add('hidden'); adminProtoView.classList.add('hidden');
            adminCountriesView.classList.add('hidden'); adminKeysView.classList.add('hidden');
        }
        function handleAvatarClick() { if (!isLoggedIn) { hideAllViews(); authView.classList.remove('hidden'); } else { profileMenu.classList.toggle('show'); } }
        function logout() { isLoggedIn = false; isAdmin = false; userStatus.classList.add('hidden'); avatarBtn.innerHTML = `<span>👤</span>`; adminDropdownLink.style.display = 'none'; profileMenu.classList.remove('show'); goBackToHome(); }
        window.onclick = function(e) { if (!e.target.closest('.profile-container')) profileMenu.classList.remove('show'); }
    </script>
</body>
</html>
