<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetVault</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; width: 100%; max-width: 400px; text-align: center; }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; background: #0284c7; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="card">
        <h1>NetVault</h1>
        <p>Приватные VPN-серверы</p>
        <button class="btn" id="btn-router">Покупка роутера</button>
        <button class="btn" id="btn-vpn">Покупка VPN</button>
    </div>

    <script>
        // --- 1. ЕДИНСТВЕННОЕ ОБЪЯВЛЕНИЕ SUPABASE ---
        const supabase = window['@supabase/supabase-js'].createClient(
            "https://ufpfkvuujlrcgpiquaep.supabase.co", 
            "sb_publishable_uTITwoPrMgGoZReqJ35x1g_ejOU4eXF"
        );

        // --- 2. ФУНКЦИИ (определяем их до того, как используем) ---
        function handleAction(action) {
            console.log("Выбрано действие:", action);
            alert("Вы выбрали: " + action);
        }

        // --- 3. НАЗНАЧЕНИЕ КНОПОК ---
        // Используем DOMContentLoaded, чтобы кнопки гарантированно существовали
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('btn-router').addEventListener('click', () => handleAction('Router'));
            document.getElementById('btn-vpn').addEventListener('click', () => handleAction('VPN'));
            
            // Инициализация Telegram Mini App
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
            }
        });
    </script>
</body>
</html>
