<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jerk Store | Сетевое оборудование и VPN</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 1px solid #334155;
        }
        
        .logo-icon {
            font-size: 50px;
            margin-bottom: 15px;
            display: inline-block;
        }
        h1 {
            font-size: 1.8rem;
            color: #38bdf8;
            margin-bottom: 25px;
        }
        
        /* Кнопки меню */
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #0369a1;
        }
        .btn-secondary {
            background-color: #475569;
        }
        .btn-secondary:hover {
            background-color: #334155;
        }

        /* Контейнер для официального виджета */
        .tg-widget-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            min-height: 40px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: Главное меню -->
    <div id="home-view" class="card">
        <div class="logo-icon">🌐</div>
        <h1>Jerk Store</h1>
        
        <!-- Сюда подставится имя пользователя после входа -->
        <div id="user-status" style="margin-bottom: 20px; color: #10b981; font-weight: bold;" class="hidden"></div>

        <button class="btn" onclick="handleAction('роутер')">Покупка роутера</button>
        <button class="btn btn-secondary" onclick="handleAction('VPN')">Покупка VPN</button>
    </div>

    <!-- ЭКРАН 2: Вход через Telegram -->
    <div id="auth-view" class="card hidden">
        <div class="logo-icon">🔐</div>
        <h1>Вход через Telegram</h1>
        <p style="color: #94a3b8; margin-bottom: 25px; font-size: 0.95rem;">Нажмите на кнопку ниже, чтобы войти с помощью своего Telegram-аккаунта.</p>
        
        <div class="tg-widget-container">
            <!-- Официальный виджет Telegram для @NettVault_bot -->
            <script async src="https://telegram.org/js/telegram-widget.js?22" 
                data-telegram-login="NettVault_bot" 
                data-size="large" 
                data-radius="8"
                data-onauth="onTelegramAuth(user)" 
                data-request-access="write">
            </script>
        </div>
    </div>

    <script>
        let isLoggedIn = false;
        let pendingAction = "";

        const homeView = document.getElementById('home-view');
        const authView = document.getElementById('auth-view');
        const userStatus = document.getElementById('user-status');

        // Проверка при нажатии на кнопки
        function handleAction(itemType) {
            if (isLoggedIn) {
                alert(`Переходим к оформлению заказа: ${itemType}`);
            } else {
                pendingAction = itemType;
                homeView.classList.add('hidden');
                authView.classList.remove('hidden');
            }
        }

        // Эта функция автоматически сработает, когда пользователь успешно зайдет через Telegram
        function onTelegramAuth(user) {
            isLoggedIn = true;
            
            // Прячем окно входа, показываем главное меню
            authView.classList.add('hidden');
            homeView.classList.remove('hidden');
            
            // Выводим имя пользователя из Telegram
            userStatus.classList.remove('hidden');
            userStatus.innerText = `👋 Привет, ${user.first_name}! Авторизация успешна.`;

            // Выводим сообщение о покупке
            setTimeout(() => {
                alert(`${user.first_name}, вы можете продолжить покупку: ${pendingAction}`);
            }, 300);
        }
    </script>

</body>
</html>
