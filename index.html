<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jerk Store | Сетевое оборудование и VPN</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }
        
        /* Виджет профиля в верхнем углу */
        .profile-container {
            position: absolute;
            top: 20px;
            left: 20px; /* Размещено слева, как ты просил */
            z-index: 100;
        }
        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: #334155;
            border: 2px solid #38bdf8;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            overflow: hidden;
            transition: transform 0.2s;
        }
        .avatar:hover {
            transform: scale(1.05);
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Выпадающее меню профиля */
        .profile-dropdown {
            position: absolute;
            top: 55px;
            left: 0;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            width: 150px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            display: none;
            flex-direction: column;
            overflow: hidden;
        }
        .dropdown-item {
            padding: 10px 15px;
            font-size: 0.9rem;
            color: #f8fafc;
            cursor: pointer;
            text-align: left;
            background: none;
            border: none;
            width: 100%;
        }
        .dropdown-item:hover {
            background: #334155;
            color: #38bdf8;
        }
        .dropdown-item.logout {
            color: #ef4444;
            border-top: 1px solid #334155;
        }
        .dropdown-item.logout:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        /* Главная карточка */
        .card {
            background: #1e293b;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 1px solid #334155;
        }
        
        .logo-icon {
            font-size: 50px;
            margin-bottom: 15px;
            display: inline-block;
        }
        h1 {
            font-size: 1.8rem;
            color: #38bdf8;
            margin-bottom: 25px;
        }
        
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #0369a1;
        }
        .btn-secondary {
            background-color: #475569;
        }
        .btn-secondary:hover {
            background-color: #334155;
        }

        .tg-widget-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            min-height: 40px;
        }

        .show {
            display: flex !important;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- БЛОК ПРОФИЛЯ СЛЕВА -->
    <div class="profile-container">
        <div class="avatar" id="avatar-btn" onclick="handleAvatarClick()">
            <!-- По умолчанию показываем эмодзи замочка -->
            <span id="avatar-placeholder">👤</span>
        </div>
        <!-- Выпадашка (скрыта по умолчанию) -->
        <div class="profile-dropdown" id="profile-menu">
            <button class="dropdown-item" onclick="openSettings()">Настройки</button>
            <button class="dropdown-item logout" onclick="logout()">Выйти</button>
        </div>
    </div>

    <!-- ЭКРАН 1: Главное меню -->
    <div id="home-view" class="card">
        <div class="logo-icon">🌐</div>
        <h1>Jerk Store</h1>
        
        <div id="user-status" style="margin-bottom: 20px; color: #10b981; font-weight: bold;" class="hidden"></div>

        <button class="btn" onclick="handleAction('роутер')">Покупка роутера</button>
        <button class="btn btn-secondary" onclick="handleAction('VPN')">Покупка VPN</button>
    </div>

    <!-- ЭКРАН 2: Вход через Telegram -->
    <div id="auth-view" class="card hidden">
        <div class="logo-icon">🔐</div>
        <h1>Вход через Telegram</h1>
        <p style="color: #94a3b8; margin-bottom: 25px; font-size: 0.95rem;">Нажмите на кнопку ниже, чтобы войти с помощью своего Telegram-аккаунта.</p>
        
        <div class="tg-widget-container">
            <!-- Официальный виджет Telegram для @NettVault_bot -->
            <script async src="https://telegram.org/js/telegram-widget.js?22" 
                data-telegram-login="NettVault_bot" 
                data-size="large" 
                data-radius="8"
                data-onauth="onTelegramAuth(user)" 
                data-request-access="write">
            </script>
        </div>
    </div>

    <script>
        let isLoggedIn = false;
        let pendingAction = "";

        const homeView = document.getElementById('home-view');
        const authView = document.getElementById('auth-view');
        const userStatus = document.getElementById('user-status');
        
        const avatarBtn = document.getElementById('avatar-btn');
        const avatarPlaceholder = document.getElementById('avatar-placeholder');
        const profileMenu = document.getElementById('profile-menu');

        // Клик по кнопкам каталога
        function handleAction(itemType) {
            if (isLoggedIn) {
                alert(`Переходим к оформлению заказа: ${itemType}`);
            } else {
                pendingAction = itemType;
                openAuthScreen();
            }
        }

        // Функция открытия экрана авторизации
        function openAuthScreen() {
            homeView.classList.add('hidden');
            authView.classList.remove('hidden');
            profileMenu.classList.remove('show');
        }

        // Клик по самой аватарке
        function handleAvatarClick() {
            if (!isLoggedIn) {
                // Если не залогинен — клик ведет на страницу входа
                openAuthScreen();
            } else {
                // Если залогинен — переключаем показ выпадающего меню (открыть/закрыть)
                profileMenu.classList.toggle('show');
            }
        }

        // Успешный вход через виджет Telegram
        function onTelegramAuth(user) {
            isLoggedIn = true;
            
            authView.classList.add('hidden');
            homeView.classList.remove('hidden');
            
            userStatus.classList.remove('hidden');
            userStatus.innerText = `👋 Привет, ${user.first_name}!`;

            // Магия подгрузки реальной аватарки:
            // Если у пользователя в ТГ есть фото, Telegram передаст ссылку в user.photo_url
            if (user.photo_url) {
                avatarBtn.innerHTML = `<img src="${user.photo_url}" alt="Avatar">`;
            } else {
                avatarBtn.innerHTML = `<span>😎</span>`; // если фото нет, ставим крутой эмодзи
            }

            if (pendingAction) {
                setTimeout(() => {
                    alert(`${user.first_name}, вы можете продолжить покупку: ${pendingAction}`);
                    pendingAction = ""; // сбрасываем
                }, 300);
            }
        }

        // Функция Настроек
        function openSettings() {
            alert("Раздел настроек находится в разработке.");
            profileMenu.classList.remove('show');
        }

        // Функция Выхода из аккаунта
        function logout() {
            isLoggedIn = false;
            userStatus.classList.add('hidden');
            
            // Возвращаем дефолтный силуэт в кружок
            avatarBtn.innerHTML = `<span id="avatar-placeholder">👤</span>`;
            profileMenu.classList.remove('show');
            
            alert("Вы вышли из системы.");
        }

        // Закрывать меню, если кликнули в любое другое место экрана
        window.onclick = function(event) {
            if (!event.target.closest('.profile-container')) {
                profileMenu.classList.remove('show');
            }
        }
    </script>

</body>
</html>
