<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jerk Store | Сетевое оборудование и VPN</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 1px solid #334155;
        }
        
        .logo-icon {
            font-size: 50px;
            margin-bottom: 15px;
            display: inline-block;
        }
        h1 {
            font-size: 1.8rem;
            color: #38bdf8;
            margin-bottom: 25px;
        }
        
        /* Кнопки меню */
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #0369a1;
        }
        .btn-secondary {
            background-color: #475569;
        }
        .btn-secondary:hover {
            background-color: #334155;
        }

        /* Кнопка ТЕЛЕГРАМ */
        .btn-tg {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: #24A1DE;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px;
            width: 100%;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn-tg:hover {
            background-color: #1d82b3;
        }
        .btn-tg:active {
            transform: scale(0.98);
        }
        .btn-tg svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        /* Прелоадер загрузки */
        .loader {
            border: 4px solid #334155;
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: Главное меню -->
    <div id="home-view" class="card">
        <div class="logo-icon">🌐</div>
        <h1>Jerk Store</h1>
        
        <div id="user-status" style="margin-bottom: 20px; color: #10b981; font-weight: bold;" class="hidden">
            🔑 Вы авторизованы через Telegram!
        </div>

        <button class="btn" onclick="handleAction('роутер')">Покупка роутера</button>
        <button class="btn btn-secondary" onclick="handleAction('VPN')">Покупка VPN</button>
    </div>

    <!-- ЭКРАН 2: Вход через Telegram -->
    <div id="auth-view" class="card hidden">
        <div class="logo-icon">🔐</div>
        <h1 id="auth-title">Вход на сайт</h1>
        <p style="color: #94a3b8; margin-bottom: 25px; font-size: 0.95rem;">Для продолжения необходимо подтвердить профиль через мессенджер.</p>
        
        <!-- Кнопка войти -->
        <button class="btn-tg" id="tg-btn" onclick="startTgAuth()">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.02-1.96 1.25-5.54 3.66-.52.36-1 .53-1.42.52-.47-.01-1.37-.26-2.03-.48-.82-.27-1.47-.42-1.42-.88.03-.24.35-.49.97-.74 3.79-1.65 6.32-2.74 7.57-3.27 3.61-1.5 4.36-1.76 4.85-1.77.11 0 .35.03.5.16.13.12.16.29.18.41.02.11.01.3-.01.37z"/>
            </svg>
            Войти через Telegram
        </button>

        <!-- Блок анимации загрузки (скрыт по умолчанию) -->
        <div id="loading-block" class="hidden">
            <div class="loader"></div>
            <p style="color: #38bdf8; font-size: 0.9rem;">Подключение к Telegram API...</p>
        </div>
    </div>

    <script>
        let isLoggedIn = false;
        let pendingAction = "";

        const homeView = document.getElementById('home-view');
        const authView = document.getElementById('auth-view');
        const userStatus = document.getElementById('user-status');
        const tgBtn = document.getElementById('tg-btn');
        const loadingBlock = document.getElementById('loading-block');

        // Клик на покупку
        function handleAction(itemType) {
            if (isLoggedIn) {
                alert(`Переходим к оформлению заказа: ${itemType}`);
            } else {
                pendingAction = itemType;
                homeView.classList.add('hidden');
                authView.classList.remove('hidden');
            }
        }

        // Логика имитации авторизации Telegram
        function startTgAuth() {
            // Прячем кнопку, показываем лоадер крутилку
            tgBtn.classList.add('hidden');
            loadingBlock.classList.remove('hidden');

            // Имитируем задержку ответа от серверов Telegram в 2 секунды
            setTimeout(() => {
                isLoggedIn = true;
                
                // Возвращаемся на главный экран
                authView.classList.add('hidden');
                homeView.classList.remove('hidden');
                
                // Показываем плашку успешного входа
                userStatus.classList.remove('hidden');

                // Сбрасываем состояние окна авторизации на будущее
                tgBtn.classList.remove('hidden');
                loadingBlock.classList.add('hidden');

                // Сообщение для пользователя
                setTimeout(() => {
                    alert(`Авторизация через Telegram успешна! Теперь вы можете оформить: ${pendingAction}`);
                }, 400);

            }, 2000); // 2000 миллисекунд = 2 секунды
        }
    </script>

</body>
</html>
