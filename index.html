<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NetVault</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; width: 100%; max-width: 400px; margin-top: 20px; }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; background: #0284c7; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; text-align: center; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="app">
        <div id="home-view" class="card">
            <h1>NetVault</h1>
            <button class="btn" id="btn-vpn">Купить VPN</button>
            <button class="btn" id="btn-router">Роутеры</button>
        </div>

        <div id="vpn-view" class="card hidden">
            <h2 id="view-title">Выбор</h2>
            <div id="list-container"></div>
            <button class="btn" id="btn-back">Назад</button>
        </div>
    </div>

    <script>
        // Инициализация Supabase
        const supabase = window['@supabase/supabase-js'].createClient(
            "https://ufpfkvuujlrcgpiquaep.supabase.co", 
            "sb_publishable_uTITwoPrMgGoZReqJ35x1g_ejOU4eXF"
        );

        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // DOM элементы
        const homeView = document.getElementById('home-view');
        const vpnView = document.getElementById('vpn-view');
        
        // --- ОБРАБОТЧИКИ (Слушатели событий) ---
        document.getElementById('btn-vpn').addEventListener('click', () => {
            console.log("Кнопка VPN нажата");
            showView('vpn-view');
        });

        document.getElementById('btn-back').addEventListener('click', () => {
            showView('home-view');
        });

        function showView(viewId) {
            homeView.classList.add('hidden');
            vpnView.classList.add('hidden');
            document.getElementById(viewId).classList.remove('hidden');
        }

        // Тест связи с базой
        async function testDb() {
            try {
                const { data, error } = await supabase.from('vpn_data').select('*');
                if (error) console.error("Ошибка Supabase:", error);
                else console.log("Данные получены:", data);
            } catch (e) {
                console.error("Ошибка сети:", e);
            }
        }
        
        testDb();
    </script>
</body>
</html>
