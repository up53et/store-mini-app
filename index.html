<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NetVault</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0f172a; color: #fff; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .container { width: 100%; max-width: 400px; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
        .btn { width: 100%; padding: 15px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; display: block; margin-top: 10px; text-align: center; }
        .btn:hover { background: #0369a1; }
        .hidden { display: none !important; }
        h1 { font-size: 1.5rem; text-align: center; color: #38bdf8; }
    </style>
</head>
<body>

<div class="container">
    <div id="home-screen" class="card">
        <h1>NetVault</h1>
        <button id="btn-vpn" class="btn">Купить VPN</button>
        <button id="btn-router" class="btn">Купить Роутер</button>
    </div>

    <div id="vpn-screen" class="card hidden">
        <h1>Выбор VPN</h1>
        <button id="btn-back" class="btn" style="background:#475569">Назад</button>
    </div>
</div>

<script>
    // 1. Инициализация Supabase (СТРОГО ОДИН РАЗ)
    const supabase = window['@supabase/supabase-js'].createClient(
        "https://ufpfkvuujlrcgpiquaep.supabase.co", 
        "sb_publishable_uTITwoPrMgGoZReqJ35x1g_ejOU4eXF"
    );

    // 2. Инициализация Telegram
    const tg = window.Telegram.WebApp;
    tg.ready();

    // 3. Логика кнопок
    const homeScreen = document.getElementById('home-screen');
    const vpnScreen = document.getElementById('vpn-screen');

    document.getElementById('btn-vpn').addEventListener('click', function() {
        console.log("Кнопка VPN нажата");
        homeScreen.classList.add('hidden');
        vpnScreen.classList.remove('hidden');
    });

    document.getElementById('btn-back').addEventListener('click', function() {
        homeScreen.classList.remove('hidden');
        vpnScreen.classList.add('hidden');
    });

    document.getElementById('btn-router').addEventListener('click', function() {
        alert("Раздел Роутеров в разработке");
    });

    // 4. Проверка связи с базой (вывод в консоль)
    supabase.from('vpn_data').select('*').then(res => {
        if(res.error) console.error("Ошибка базы:", res.error);
        else console.log("База данных подключена успешно!");
    });
</script>

</body>
</html>
