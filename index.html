<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetVault | Сетевое оборудование и VPN</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }
        
        /* Профиль слева */
        .profile-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
        }
        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: #334155;
            border: 2px solid #38bdf8;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            position: relative;
            transition: transform 0.2s;
        }
        .avatar:hover {
            transform: scale(1.05);
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        
        .admin-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            font-size: 16px;
            background: #eab308;
            border-radius: 50%;
            padding: 2px;
            display: none;
            line-height: 1;
            z-index: 110;
        }

        .profile-dropdown {
            position: absolute;
            top: 55px;
            left: 0;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            width: 160px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            display: none;
            flex-direction: column;
            overflow: hidden;
        }
        .dropdown-item {
            padding: 10px 15px;
            font-size: 0.9rem;
            color: #f8fafc;
            cursor: pointer;
            text-align: left;
            background: none;
            border: none;
            width: 100%;
        }
        .dropdown-item:hover {
            background: #334155;
            color: #38bdf8;
        }
        .dropdown-item.admin-btn {
            color: #eab308;
            font-weight: bold;
            border-bottom: 1px solid #334155;
            display: none;
        }
        .dropdown-item.logout {
            color: #ef4444;
            border-top: 1px solid #334155;
        }
        .dropdown-item.logout:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        /* Главная карточка */
        .card {
            background: #1e293b;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 460px;
            width: 100%;
            border: 1px solid #334155;
        }
        
        .logo-icon {
            font-size: 50px;
            margin-bottom: 15px;
            display: inline-block;
        }
        h1 {
            font-size: 1.8rem;
            color: #38bdf8;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }
        
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn:hover {
            background-color: #0369a1;
        }
        .btn:active {
            transform: scale(0.99);
        }
        .btn-secondary {
            background-color: #475569;
        }
        .btn-secondary:hover {
            background-color: #334155;
        }
        .btn-danger {
            background-color: #ef4444;
            padding: 4px 8px;
            font-size: 0.8rem;
            width: auto;
            display: inline-block;
            margin: 0;
            border-radius: 4px;
        }
        .btn-danger:hover {
            background-color: #dc2626;
        }

        .btn-flag {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        }
        .key-display {
            background: #1e293b;

            word-break: break-all;
